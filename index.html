<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartSchool</title>
    <meta name="description" content="SmartSchool – free, open-source school management for every Filipino school, online or offline.">
    <meta name="theme-color" content="#1f5f46">
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>

<header class="site-header">
    <div class="wrap header-inner">
        <a href="#top" class="brand">
            <img src="assets/logo.svg" alt="" width="36" height="36">
            <span>SmartSchool</span>
        </a>
        <nav class="main-nav" data-i18n-attr="aria-label:nav.label">
            <a href="#problem" data-i18n="nav.problem"></a>
            <a href="#who" data-i18n="nav.who"></a>
            <a href="#features" data-i18n="nav.features"></a>
            <a href="#install" data-i18n="nav.install"></a>
            <a href="#requirements" data-i18n="nav.requirements"></a>
            <a href="#hosting" data-i18n="nav.hosting"></a>
            <a href="#faq" data-i18n="nav.faq"></a>
        </nav>
        <div class="header-actions">
            <div class="lang" role="group" data-i18n-attr="aria-label:lang.label">
                <button type="button" data-lang="en" aria-pressed="true">EN</button>
                <button type="button" data-lang="tl" aria-pressed="false">TL</button>
            </div>
            <a class="btn btn-primary btn-small" href="#download" data-i18n="nav.download"></a>
        </div>
    </div>
</header>

<main id="main">
    <noscript><p class="noscript">SmartSchool needs JavaScript to show this page. Please turn it on. / Kailangan ng JavaScript para makita ang page na ito.</p></noscript>

    <!-- Hero -->
    <section class="hero" id="top">
        <div class="wrap hero-inner">
            <p class="eyebrow" data-i18n="hero.eyebrow"></p>
            <h1 data-i18n="hero.title"></h1>
            <p class="lead" data-i18n="hero.subtitle"></p>
            <div class="hero-cta" id="hero-download">
                <!-- Filled by js/app.js from data/release.json and the visitor's OS:
                     Windows → one "Download SmartSchool for Windows" button;
                     Linux/Mac → the one-command Linux install. -->
            </div>
            <p class="hero-how"><a href="#install" data-i18n="hero.install"></a></p>
            <ul class="hero-facts">
                <li data-i18n="hero.fact1"></li>
                <li data-i18n="hero.fact2"></li>
                <li data-i18n="hero.fact3"></li>
            </ul>
        </div>
    </section>

    <!-- The problem -->
    <section class="problem" id="problem" aria-labelledby="problem-title">
        <div class="wrap">
            <h2 id="problem-title" data-i18n="problem.title"></h2>
            <p class="section-lead" data-i18n="problem.intro"></p>
            <div class="stat-grid" id="stat-grid"></div>
            <p class="problem-close" data-i18n="problem.closing"></p>
        </div>
    </section>

    <!-- Evidence -->
    <section class="section" id="evidence" aria-labelledby="evidence-title">
        <div class="wrap">
            <h2 id="evidence-title" data-i18n="evidence.title"></h2>
            <p class="section-lead" data-i18n="evidence.intro"></p>
            <div class="evidence-grid" id="evidence-grid"></div>
            <p class="disclaimer" data-i18n="evidence.disclaimer"></p>
        </div>
    </section>

    <!-- Who it's for -->
    <section class="section quote-section" aria-label="A word from the developer">
        <div class="container">
            <figure class="quote">
                <blockquote><p data-i18n="quote.text"></p></blockquote>
                <figcaption>— Charles Andrei Galvan, <span data-i18n="quote.role"></span></figcaption>
            </figure>
        </div>
    </section>

    <section class="section alt" id="who" aria-labelledby="who-title">
        <div class="wrap">
            <h2 id="who-title" data-i18n="who.title"></h2>
            <div class="card-grid three">
                <article class="card">
                    <div class="card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg></div>
                    <h3 data-i18n="who.c1.title"></h3>
                    <p data-i18n="who.c1.text"></p>
                </article>
                <article class="card">
                    <div class="card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
                    <h3 data-i18n="who.c2.title"></h3>
                    <p data-i18n="who.c2.text"></p>
                </article>
                <article class="card">
                    <div class="card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></div>
                    <h3 data-i18n="who.c3.title"></h3>
                    <p data-i18n="who.c3.text"></p>
                </article>
            </div>
        </div>
    </section>

    <!-- Features -->
    <section class="section" id="features" aria-labelledby="features-title">
        <div class="wrap">
            <h2 id="features-title" data-i18n="features.title"></h2>
            <p class="section-lead" data-i18n="features.intro"></p>
            <div class="feature-grid">
                <div class="feature"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6M9 17h4"/></svg><h3 data-i18n="features.f1.title"></h3><p data-i18n="features.f1.text"></p></div>
                <div class="feature"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h2v2M21 15v6h-6M15 19v2"/></svg><h3 data-i18n="features.f2.title"></h3><p data-i18n="features.f2.text"></p></div>
                <div class="feature"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg><h3 data-i18n="features.f3.title"></h3><p data-i18n="features.f3.text"></p></div>
                <div class="feature"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><h3 data-i18n="features.f4.title"></h3><p data-i18n="features.f4.text"></p></div>
                <div class="feature"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M2 9a15 15 0 0 1 20 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg><h3 data-i18n="features.f5.title"></h3><p data-i18n="features.f5.text"></p></div>
                <div class="feature"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c-1 4-4 7-7 8M13 21l4-9 4 9M14.5 18h5"/></svg><h3 data-i18n="features.f6.title"></h3><p data-i18n="features.f6.text"></p></div>
                <div class="feature"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg><h3 data-i18n="features.f7.title"></h3><p data-i18n="features.f7.text"></p></div>
            </div>
        </div>
    </section>

    <!-- Our schools (photos) -->

    <!-- Install guide -->
    <section class="section" id="install" aria-labelledby="install-title">
        <div class="wrap">
            <h2 id="install-title" data-i18n="install.title"></h2>
            <p class="section-lead" data-i18n="install.intro"></p>

            <div class="before">
                <h3 data-i18n="install.before_title"></h3>
                <ul class="checklist" id="before-list"></ul>
                <p class="time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="install-time"></span></p>
            </div>

            <!-- The LAN / Online choice is made INSIDE the installer (single source of truth:
                 the installer writes SMARTSCHOOL_MODE). The website never asks this before download. -->
            <div class="steps-panel">
                <ol class="steps" id="steps"></ol>
            </div>

            <details class="advanced" id="advanced">
                <summary data-i18n="install.advanced_title"></summary>
                <div class="advanced-body">
                    <h3 data-i18n="install.adv_linux_title"></h3>
                    <p data-i18n="install.adv_linux_text"></p>
                    <div class="code"><pre><code id="linux-cmd"></code></pre><button type="button" class="copy" data-i18n="install.copy"></button></div>
                    <h3 class="sub-title" data-i18n="install.adv_hosted_title"></h3>
                    <ol class="steps" id="hosted-steps"></ol>
                </div>
            </details>

            <h3 class="sub-title" data-i18n="install.trouble_title"></h3>
            <div class="accordion" id="trouble"></div>

            <div class="help">
                <div>
                    <h3 data-i18n="install.help_title"></h3>
                    <p data-i18n="install.help_text"></p>
                </div>
                <a class="btn btn-primary" id="contact-btn" href="#" data-i18n="install.help_btn"></a>
            </div>
        </div>
    </section>

    <!-- Requirements (what each mode needs – shown again inside the installer) -->
    <section class="section" id="requirements" aria-labelledby="req-title">
        <div class="wrap">
            <h2 id="req-title" data-i18n="req.title"></h2>
            <p class="section-lead" data-i18n="req.intro"></p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th scope="col"></th><th scope="col" data-i18n="req.lan"></th><th scope="col" data-i18n="req.online"></th></tr></thead>
                    <tbody>
                        <tr><th scope="row" data-i18n="req.r1"></th><td data-i18n="req.r1_lan"></td><td data-i18n="req.r1_online"></td></tr>
                        <tr><th scope="row" data-i18n="req.r2"></th><td data-i18n="req.r2_lan"></td><td data-i18n="req.r2_online"></td></tr>
                        <tr><th scope="row" data-i18n="req.r3"></th><td data-i18n="req.r3_lan"></td><td data-i18n="req.r3_online"></td></tr>
                        <tr><th scope="row" data-i18n="req.r4"></th><td data-i18n="req.r4_lan"></td><td data-i18n="req.r4_online"></td></tr>
                        <tr><th scope="row" data-i18n="req.r5"></th><td data-i18n="req.r5_lan"></td><td data-i18n="req.r5_online"></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <section class="section alt" id="hosting" aria-labelledby="hosting-title">
        <div class="container">
            <h2 id="hosting-title" data-i18n="host.title"></h2>
            <p class="section-lead" data-i18n="host.intro"></p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th data-i18n="host.size"></th><th data-i18n="host.mode"></th><th data-i18n="host.server"></th><th data-i18n="host.database"></th><th data-i18n="host.backup"></th></tr></thead>
                    <tbody id="hosting-rows"></tbody>
                </table>
            </div>
            <div class="two-col">
                <article class="card"><h3 data-i18n="host.ask_title"></h3><ul class="ticks" id="hosting-ask"></ul></article>
                <article class="card"><h3 data-i18n="host.steps_title"></h3><p data-i18n="host.steps_text"></p><p><a class="btn btn-primary" href="#advanced" data-i18n="host.steps_btn"></a></p></article>
            </div>
        </div>
    </section>


    <!-- Download -->
    <section class="section alt" id="download" aria-labelledby="download-title">
        <div class="wrap">
            <h2 id="download-title" data-i18n="download.title"></h2>
            <p class="section-lead"><span data-i18n="download.version"></span> <strong id="release-version"></strong> · <span id="release-date"></span></p>
            <div class="download-grid" id="download-grid"></div>
            <details class="checksum">
                <summary data-i18n="download.checksum_title"></summary>
                <div>
                    <p data-i18n="download.checksum_text"></p>
                    <p><strong>Windows</strong> (PowerShell)</p>
                    <div class="code"><pre><code>Get-FileHash .\SmartSchool-Setup.exe -Algorithm SHA256</code></pre><button type="button" class="copy" data-i18n="install.copy"></button></div>
                    <p><strong>Mac / Linux</strong></p>
                    <div class="code"><pre><code>shasum -a 256 SmartSchool*</code></pre><button type="button" class="copy" data-i18n="install.copy"></button></div>
                    <p data-i18n="download.checksum_match"></p>
                </div>
            </details>
        </div>
    </section>

    <!-- FAQ -->
    <section class="section" id="faq" aria-labelledby="faq-title">
        <div class="wrap narrow">
            <h2 id="faq-title" data-i18n="faq.title"></h2>
            <div class="accordion">
                <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
                <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
                <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
                <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
                <details><summary data-i18n="faq.q5"></summary><p data-i18n="faq.a5"></p></details>
                <details><summary data-i18n="faq.q6"></summary><p data-i18n="faq.a6"></p></details>
            </div>
        </div>
    </section>

    <!-- Open source -->
    <section class="section alt" id="contribute" aria-labelledby="oss-title">
        <div class="wrap">
            <h2 id="oss-title" data-i18n="oss.title"></h2>
            <p class="section-lead" data-i18n="oss.intro"></p>
            <div class="card-grid three">
                <article class="card"><h3 data-i18n="oss.license_title"></h3><p><span data-i18n="oss.license_text"></span> <a href="https://github.com/Charles494-prog/SmartSchoolWebsite/blob/main/LICENSE" target="_blank" rel="noopener">GNU AGPL-3.0</a></p><p data-i18n="oss.license_enterprise"></p></article>
                <article class="card"><h3 data-i18n="oss.teachers_title"></h3><p data-i18n="oss.teachers_text"></p></article>
                <article class="card"><h3 data-i18n="oss.devs_title"></h3><p data-i18n="oss.devs_text"></p></article>
            </div>
            <p class="center"><a class="btn btn-primary btn-big" href="https://github.com/Charles494-prog/SmartSchoolWebsite" target="_blank" rel="noopener" data-i18n="oss.github"></a></p>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="wrap footer-inner">
        <div class="footer-brand"><img src="assets/logo.svg" alt="" width="28" height="28"><span>SmartSchool</span></div>
        <p class="credit"><span data-i18n="footer.credit"></span> Charles Andrei Galvan · <a href="#install" data-i18n="install.help_btn"></a></p>
        <p data-i18n="footer.disclaimer"></p>
        <div class="footer-links">
            <span><span data-i18n="footer.license"></span> <a href="https://github.com/Charles494-prog/SmartSchoolWebsite/blob/main/LICENSE" target="_blank" rel="noopener">GNU AGPL-3.0</a></span>
            <a href="https://github.com/Charles494-prog/SmartSchoolWebsite" target="_blank" rel="noopener">GitHub</a>
            <div class="lang" role="group" data-i18n-attr="aria-label:lang.label">
                <button type="button" data-lang="en" aria-pressed="true">EN</button>
                <button type="button" data-lang="tl" aria-pressed="false">TL</button>
            </div>
        </div>
    </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
